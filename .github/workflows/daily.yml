# GitHub 每日热门项目采集工作流(只入库不推送;推送改由每周 weekly.yml 汇总)
name: daily-collect

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间 09:00
  workflow_dispatch: {}

permissions:
  contents: write

# 与 weekly.yml 共用一个并发组:两边都会往仓库提交,串行执行避免 push 冲突
concurrency:
  group: repo-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.yaml') }}

      - name: Run collector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}   # 描述中文翻译(DashScope qwen);未配则保留英文
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}   # 向量编码(须与本机查询同源,未配则采集报错)
        run: python -m ghtrend.collect

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: trending $(date -u +%F)"
          git push
